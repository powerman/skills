# scripts/.mockery.yml: stateful fakes of World of each program, generated by mockery.
# The template is a copy of fake from github.com/powerman/mockery-templates
# in scripts/.mockery/ (fake.templ and fake.templ.schema.json).
log-level: warn
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/you/project
_anchors:
  fake: &fake
    template: file://.mockery/fake.templ
    dir: '{{.InterfaceDir}}'
    pkgname: '{{.SrcPackageName}}_test'
    filename: 'fake.{{.InterfaceFile | base | trimSuffix ".go"}}_test.go'
    structname: 'Fake{{.InterfaceName | firstUpper}}'
packages:
  # Every package of every program is scanned for World,
  # so a new program gets its Fake without a change here.
  github.com/you/project/scripts:
    config:
      !!merge <<: *fake
      recursive: true
      include-interface-regex: '^World$'
