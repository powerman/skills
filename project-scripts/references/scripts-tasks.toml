['scripts:bump']
description = 'Upgrade Go version and Go dependencies'
hide = true
dir = 'scripts'
run = '''
go get "go@$(go env GOVERSION | cut -c 3-)" toolchain@none
go get -u -t ./...
go mod tidy
'''

['scripts:build']
description = 'Build Go scripts into .cache/bin/'
hide = true
depends = 'scripts:build:clean'
dir = 'scripts'
silent = 'stdout' # Hide "sources up-to-date, skipping", but keep build errors.
sources = ['**/*']
outputs = ['../.cache/bin/*']
run = 'go build -o "$PWD/../.cache/bin/" ./...'

['scripts:build:clean']
description = 'Remove programs of removed Go scripts from .cache/bin/'
hide = true
quiet = true
run = '''
for f in .cache/bin/*; do
    [ -d "scripts/${f#.cache/bin/}" ] || rm -f "$f"
done
'''

['scripts:generate']
description = 'Generate Go code of Go scripts'
hide = true
dir = 'scripts'
run = 'go generate ./...'

['scripts:fix']
description = 'Apply automatic fixes to Go scripts'
dir = 'scripts'
run = '''
go fix ./...
golangci-lint run --fix --issues-exit-code=0
'''

['scripts:fmt']
description = 'Format Go scripts'
hide = true
dir = 'scripts'
run = 'golangci-lint fmt'

['scripts:lint']
description = 'Lint Go scripts and their usage specs'
hide = true
dir = 'scripts'
run = [
    'golangci-lint run',
    { tasks = ['scripts:lint:*'] },
]

['scripts:lint:usage']
description = 'Lint usage specs of Go scripts'
hide = true
depends = 'scripts:build'
run = '''
for f in .cache/bin/*; do
    spec=$("$f" --usage-spec)
    printf '%s\n' "$spec" | usage lint -W -
done
'''

['scripts:test']
description = 'Test Go scripts'
dir = 'scripts'
run = 'gotestsum -- -race -timeout=60s ./...'

['scripts:cover']
description = 'Show test coverage of Go scripts'
depends = 'scripts:cover:generate'
dir = 'scripts'
run = 'go tool cover -func="{{config_root}}/{{vars.scripts_cover}}"'

['scripts:cover:browse']
description = 'Show test coverage of Go scripts in a browser'
depends = 'scripts:cover:generate'
env.TMPDIR = "{{ get_env(name='BROWSER_TMPDIR', default=get_env(name='TMPDIR', default='/tmp')) }}"
dir = 'scripts'
run = 'go tool cover -html="{{config_root}}/{{vars.scripts_cover}}"'

['scripts:cover:generate']
hide = true
depends = 'cachedir'
dir = 'scripts'
run = '''
gotestsum -- \
    -coverpkg="$(go list ./... | paste -s -d,)" \
    -coverprofile "{{config_root}}/{{vars.scripts_cover}}" \
    ./...
'''
