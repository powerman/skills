['scripts:bump']
description = 'Upgrade Go version and Go dependencies'
hide = true
dir = 'scripts'
run = '''
go get "go@$(go env GOVERSION | cut -c 3-)" toolchain@none
go get -u -t ./...
go mod tidy
'''

['scripts:build']
description = 'Build Go scripts into $SCRIPTS_BIN'
hide = true
dir = 'scripts'
silent = 'stdout' # Hide "sources up-to-date, skipping", but keep build errors.
sources = ['**/*']
outputs = ['{{env.SCRIPTS_BIN}}/*']
run = '''
for f in "${SCRIPTS_BIN:?}"/*; do
    [ -d "${f##*/}" ] || rm -f "$f"
done
go build -ldflags="-s -w" -o "${SCRIPTS_BIN:?}/" ./...
'''
# Only in a project which supports Windows.
run_windows = """
powershell -NoProfile -Command "if (Test-Path $env:SCRIPTS_BIN) { \
    Get-ChildItem $env:SCRIPTS_BIN -File \
    | Where-Object { -not (Test-Path -PathType Container $_.BaseName) } \
    | Remove-Item }" \
&& go build -ldflags="-s -w" -o "%SCRIPTS_BIN%/" ./...\
"""

['scripts:generate']
description = 'Generate Go code of Go scripts'
hide = true
dir = 'scripts'
# mockery fails to load a package with an outdated output, so outputs are removed first.
run = '''
git grep --untracked -lz '^// Code generated by mockery; DO NOT EDIT\.$' -- '*.go' | xargs -0 -r rm --
mockery
go generate ./...
'''

['scripts:fix']
description = 'Apply automatic fixes to Go scripts'
dir = 'scripts'
run = '''
go fix ./...
golangci-lint run --fix --issues-exit-code=0
'''

['scripts:fmt']
description = 'Format Go scripts'
hide = true
dir = 'scripts'
run = 'golangci-lint fmt'

['scripts:lint']
description = 'Lint Go scripts and their usage specs'
hide = true
dir = 'scripts'
run = [
    'golangci-lint run',
    { tasks = ['scripts:lint:*'] },
]

['scripts:lint:usage']
description = 'Lint usage specs of Go scripts'
hide = true
depends = 'scripts:build'
# usage lint prints both "No issues found." and findings to stdout,
# so findings are shown by a second run only when the first one fails.
run = '''
for f in "${SCRIPTS_BIN:?}"/*; do
    spec=$("$f" --usage-spec)
    printf '%s\n' "$spec" | usage lint -W - >/dev/null 2>&1 ||
        printf '%s\n' "$spec" | usage lint -W -
done
'''

['scripts:test']
description = 'Test Go scripts'
dir = 'scripts'
run = 'gotestsum -- -race -timeout=60s ./...'

['scripts:cover']
description = 'Show test coverage of Go scripts'
depends = 'scripts:cover:generate'
dir = 'scripts'
run = 'go tool cover -func="{{config_root}}/{{vars.scripts_cover}}"'

['scripts:cover:browse']
description = 'Show test coverage of Go scripts in a browser'
depends = 'scripts:cover:generate'
env.TMPDIR = "{{ get_env(name='BROWSER_TMPDIR', default=get_env(name='TMPDIR', default='/tmp')) }}"
dir = 'scripts'
run = 'go tool cover -html="{{config_root}}/{{vars.scripts_cover}}"'

['scripts:cover:generate']
hide = true
depends = 'cachedir'
dir = 'scripts'
run = '''
gotestsum -- \
    -coverpkg="$(go list ./... | paste -s -d,)" \
    -coverprofile "{{config_root}}/{{vars.scripts_cover}}" \
    ./...
'''
